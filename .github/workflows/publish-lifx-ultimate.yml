name: Publish LIFX Ultimate

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/publish-lifx-ultimate.yml
      - homeassistant/components/lifx/**
      - script/lifx_ultimate_hacs_export.py
      - script/lifx_ultimate_hacs_assets/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check out HACS distribution
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: distribution
          ref: main
          repository: sabaatworld/ha-lifx-ultimate
          ssh-key: ${{ secrets.LIFX_ULTIMATE_PUBLISH_KEY }}

      - name: Export LIFX Ultimate
        run: >-
          python script/lifx_ultimate_hacs_export.py
          --source homeassistant/components/lifx
          --destination distribution
          --source-revision "$GITHUB_SHA"

      - name: Commit updated distribution
        working-directory: distribution
        run: |
          git remote set-url origin git@github.com:sabaatworld/ha-lifx-ultimate.git
          if git diff --quiet; then
            exit 0
          fi
          VERSION="$(python -c 'import json; print(json.load(open(".lifx-ultimate-publish.json"))["version"])')"
          git config user.name "LIFX Ultimate Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: publish LIFX Ultimate from ${GITHUB_SHA}"
          git tag -a "$VERSION" -m "LIFX Ultimate $VERSION"
          git push origin HEAD:main "refs/tags/$VERSION"
